[package]
name = "humanart-ui"
description = "The custom GPU-rendered UI toolkit: layout, widgets, text, docking and input. Knows nothing of characters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
humanart-core.workspace = true
humanart-math = { workspace = true, features = ["linalg", "color"] }
humanart-io = { workspace = true, features = ["ttf", "png", "json"] }
humanart-gpu.workspace = true
humanart-shaders.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["dx12", "metal", "vulkan", "gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
