[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

# [DEP-01] The only third-party crates: wgpu and the reference application's windowing crate.
# Everything else is written in-house; see docs/dependencies.md.
[workspace.dependencies]
humanart-core = { path = "crates/core" }
humanart-math = { path = "crates/math" }
humanart-io = { path = "crates/io" }
humanart-model = { path = "crates/model" }
humanart-doc = { path = "crates/doc" }
humanart-gpu = { path = "crates/gpu" }
humanart-shaders = { path = "crates/shaders" }
humanart-render = { path = "crates/render" }
humanart-ui = { path = "crates/ui" }
humanart-tools = { path = "crates/tools" }
humanart-capture = { path = "crates/capture" }
humanart-agent = { path = "crates/agent" }
humanart-runtime = { path = "crates/runtime" }
humanart-platform = { path = "crates/platform" }
# Backends are chosen per target in the crates that use wgpu (native: dx12, metal, vulkan, gles;
# wasm32: webgpu), so the library crates compile for wasm32-unknown-unknown [PLAT-03].
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
winit = "0.30.13"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
# Hex colour literals read best unseparated; UI state structs are flag-heavy.
unreadable_literal = "allow"
struct_excessive_bools = "allow"
# Numeric code: single-letter names are the notation of the papers the code follows,
# and exact float comparisons are deliberate where they appear.
many_single_char_names = "allow"
similar_names = "allow"
float_cmp = "allow"
# `assert!(x.is_empty())` reads better in tests than `assert_eq!(x, [])`.
assert_is_empty = "allow"
# Every fallible function documents its errors through its error enum's variants.
missing_errors_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
inline_always = "allow"
# Technical prose names algorithms and formats (SplitMix64, OpenEXR) without code ticks.
doc_markdown = "allow"
# [ERR-03] also enforced by tools/check-tree.sh, which has the allowlist.
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# [PERF-R7]
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Release code with symbols, for profilers.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Codecs, solvers and fuzz tests are painfully slow unoptimised.
# Debug info is line tables only: panics and backtraces keep file and line, while every test
# binary's debug file shrinks several times (the owner's disk filled up). Use the `profiling`
# profile, or set `debug = true` locally, to step through code with variables in a debugger.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Shader compilation (naga) and wgpu validation likewise. No debug info for dependencies.
[profile.dev.package."*"]
opt-level = 3
debug = false
